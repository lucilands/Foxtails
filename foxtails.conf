[server]
#port               = 8080
path               = /opt/foxtails/http.sock
foxctl_path        = /opt/foxtails/ctl.sock
log-level          = 0
num-workers        = 4
max-connections    = 512
# Keep alive connection timeout is measured in seconds
keep-alive-timeout = 75
request-timeout    = 10
#log-file           = foxtails.log

[app]
root=./example

[backends]
timeout=5
